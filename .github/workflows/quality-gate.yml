name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    name: Targeted tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run targeted merge checks
        run: python -m pytest -q tests/test_shared_knife_workflow.py tests/test_longfeng_erp_entry.py tests/test_project_governance.py tests/test_version_display.py
