name: Windows test machine

on:
  push:
    branches:
      - codex/windows-test
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit SHA to test
        required: true
        default: codex/windows-test
      real_batch_paths:
        description: Semicolon-separated absolute batch folders on the Windows runner
        required: false
        type: string
      build_installer:
        description: Build the EXE installer
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-test-machine
  cancel-in-progress: false

jobs:
  test-and-package:
    name: Real Windows tests and package
    runs-on: [self-hosted, Windows, X64, automatic-print]
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      PSExecutionPolicyPreference: Bypass
      REAL_BATCH_PATHS: ${{ inputs.real_batch_paths || vars.AUTOMATIC_PRINT_REAL_BATCH_PATHS }}
      BUILD_INSTALLER: ${{ github.event_name == 'push' || inputs.build_installer }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.sha }}
          clean: true

      - name: Create isolated Python 3.12 environment
        shell: powershell
        run: |
          $python = "C:\actions-runner\externals\python\python.exe"
          if (-not (Test-Path -LiteralPath $python)) {
            throw "Runner Python is missing. Run windows/prepare-runner-python.ps1 as Administrator."
          }
          & $python -m venv .runner-venv
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the runner virtual environment." }
          $venvPython = Join-Path $PWD ".runner-venv\Scripts\python.exe"
          "PYTHON_EXE=$venvPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install test and build dependencies
        shell: powershell
        run: '& $env:PYTHON_EXE -m pip install -r requirements-build.txt pytest'

      - name: Run complete automated test suite
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          & $env:PYTHON_EXE -m pytest -q --junitxml=artifacts/test-results/pytest.xml

      - name: Run real-image layout regressions
        if: env.REAL_BATCH_PATHS != ''
        shell: powershell
        run: ./windows/run-real-batch-ci.ps1 -BatchPaths "$env:REAL_BATCH_PATHS" -ArtifactRoot artifacts/real-batches

      - name: Record skipped real-image regression
        if: env.REAL_BATCH_PATHS == ''
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/real-batches | Out-Null
          "Skipped: configure AUTOMATIC_PRINT_REAL_BATCH_PATHS or dispatch with real_batch_paths." |
            Set-Content -Encoding UTF8 artifacts/real-batches/SKIPPED.txt

      - name: Inject shared S2B gateway key
        if: env.BUILD_INSTALLER == 'true'
        shell: powershell
        env:
          S2B_BATCH_INFO_KEY: ${{ secrets.AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY }}
        run: |
          if (-not $env:S2B_BATCH_INFO_KEY) {
            throw "Missing AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY repository secret"
          }
          $escaped = $env:S2B_BATCH_INFO_KEY.Replace('\\', '\\\\').Replace('"', '\\"')
          Set-Content -Encoding UTF8 automatic_print/automation/api/s2b/deployment.py `
            "S2B_BATCH_INFO_KEY = \"$escaped\""

      - name: Build application
        if: env.BUILD_INSTALLER == 'true'
        shell: powershell
        run: '& $env:PYTHON_EXE -m PyInstaller --noconfirm --clean AutomaticPrint.spec'

      - name: Build installer
        if: env.BUILD_INSTALLER == 'true'
        shell: powershell
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            "C:\Program Files\Inno Setup 6\ISCC.exe"
            Get-ChildItem "C:\Users\*\AppData\Local\Programs\Inno Setup 6\ISCC.exe" `
              -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup 6 is not installed on the self-hosted runner."
          }
          $version = "0.1.0-windows-test.${{ github.run_number }}"
          & $iscc "/DMyAppVersion=$version" "installer\automatic-print.iss"

      - name: Collect startup and crash logs
        if: always()
        shell: powershell
        run: ./windows/collect-runner-logs.ps1 -Destination artifacts/logs

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-${{ github.run_id }}
          path: |
            artifacts/test-results
            artifacts/real-batches
            artifacts/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows installer
        if: env.BUILD_INSTALLER == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticPrint-Windows-${{ github.run_id }}
          path: installer-dist/AutomaticPrint-Setup.exe
          if-no-files-found: error
          retention-days: 14
