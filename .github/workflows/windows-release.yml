name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Inject shared S2B gateway key
        shell: pwsh
        env:
          S2B_BATCH_INFO_KEY: ${{ secrets.AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY }}
        run: |
          if (-not $env:S2B_BATCH_INFO_KEY) {
            throw "Missing AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY repository secret"
          }
          $pythonLiteral = python -c `
            "import os; print(repr(os.environ['S2B_BATCH_INFO_KEY']))"
          if ($LASTEXITCODE -ne 0 -or -not $pythonLiteral) {
            throw "Failed to encode AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY"
          }
          Set-Content -Encoding UTF8 `
            automatic_print/automation/api/s2b/deployment.py `
            "S2B_BATCH_INFO_KEY = $pythonLiteral"

      - name: Build application
        run: pyinstaller --noconfirm --clean AutomaticPrint.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version -or $version -eq "main") { $version = "0.1.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\automatic-print.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticPrint-Windows
          path: installer-dist/AutomaticPrint-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "installer-dist/AutomaticPrint-Setup.exe" --generate-notes --title "Automatic Print ${{ github.ref_name }}"
