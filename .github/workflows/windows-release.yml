name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/uv-test-installer
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt pytest

      - name: Run UV and merge regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_shared_knife_workflow.py tests/test_longfeng_erp_entry.py tests/test_project_governance.py tests/test_version_display.py tests/test_putian_platform.py tests/test_developer_mode.py tests/test_uv_sheet.py tests/test_ydwx_download.py

      - name: Inject shared S2B gateway key
        shell: pwsh
        env:
          S2B_BATCH_INFO_KEY: ${{ secrets.AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY }}
        run: |
          if (-not $env:S2B_BATCH_INFO_KEY) {
            throw "Missing AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY repository secret"
          }
          $pythonLiteral = python -c `
            "import os; print(repr(os.environ['S2B_BATCH_INFO_KEY']))"
          if ($LASTEXITCODE -ne 0 -or -not $pythonLiteral) {
            throw "Failed to encode AUTOMATIC_PRINT_S2B_BATCH_INFO_KEY"
          }
          Set-Content -Encoding UTF8 `
            automatic_print/automation/api/s2b/deployment.py `
            "S2B_BATCH_INFO_KEY = $pythonLiteral"

      - name: Verify YDWX shared login through packaged key
        run: >-
          python -c "from automatic_print.automation.api.ydwx import list_batches;
          batches = list_batches();
          assert batches, 'YDWX returned no production batches';
          print(f'YDWX shared login succeeded: {len(batches)} batches')"

      - name: Build application
        run: pyinstaller --noconfirm --clean AutomaticPrint.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ('${{ github.ref_type }}' -ne 'tag') {
            $version = "0.1.333-uv-test.${{ github.run_number }}"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\automatic-print.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticPrint-Windows
          path: installer-dist/AutomaticPrint-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "installer-dist/AutomaticPrint-Setup.exe" --generate-notes --title "Automatic Print ${{ github.ref_name }}"
